# Railway configuration for SaleWatcher
# https://docs.railway.app/reference/config-as-code

# -------------------------------------------------------
# Daily Gmail sync cron job
# Runs at 11:00 UTC (6 AM ET) — before the 8 AM ET alert
# -------------------------------------------------------
# REQUIRED env vars in Railway dashboard:
#   CRON_SECRET   — shared secret for X-Cron-Secret header
#   RAILWAY_PUBLIC_DOMAIN — auto-set by Railway (your app's public URL)
# -------------------------------------------------------

[cron."daily-gmail-sync"]
schedule = "0 11 * * *"
command = """curl -s -f -X POST \
  "https://$RAILWAY_PUBLIC_DOMAIN/api/email/sync/recent" \
  -H "X-Cron-Secret: $CRON_SECRET" \
  -H "Content-Type: application/json" \
  && echo "daily-gmail-sync OK" \
  || echo "daily-gmail-sync FAILED"
"""
